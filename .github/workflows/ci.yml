name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jwt-auth-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install & test smarthr360-jwt-auth
        run: |
          pip install -e "packages/smarthr360-jwt-auth[dev]"
          pytest packages/smarthr360-jwt-auth/tests/ -v

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          mkdir -p keys && touch keys/jwt_private.pem keys/jwt_public.pem
          docker compose config -q

  e2e:
    # Boots the whole platform from source (submodules) and runs the
    # golden-path smoke test across all services.
    runs-on: ubuntu-latest
    needs: [jwt-auth-package, compose-validate]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare env & RS256 keys
        run: |
          cp .env.example .env
          ./scripts/generate_rsa_keys.sh
          # The services run as an unprivileged user (uid 10001). Compose
          # secrets are bind mounts, so on Linux the container sees the host
          # file's real mode -- and generate_rsa_keys.sh writes 0600 owned by
          # the runner, which uid 10001 cannot read. Docker Desktop remaps
          # ownership, which is why this only fails on CI. The key is
          # generated fresh per run and never leaves the runner, so relaxing
          # it here is safe; the 0600 default stays for developers and prod.
          chmod 644 keys/jwt_private.pem
      - name: Free disk space
        # future-skills carries a heavy ML stack (llvmlite, numba, mlflow);
        # building it alongside the other services overruns the runner's
        # ~14 GB. Reclaiming the preinstalled toolchains buys ~20 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Boot platform (compose)
        run: |
          docker compose up -d --build \
            postgres auth core-hr career-sim workload policy-gen retention future-skills
      - name: Run migrations in each service
        run: |
          for s in auth core-hr career-sim workload policy-gen retention future-skills; do
            docker compose exec -T $s python manage.py migrate --noinput
          done
      - name: Seed + E2E smoke
        # Runs before the test suites: several suites exercise real
        # cross-service HTTP calls, which write into their siblings' runtime
        # databases. Seeding after that leaves the seeder reconciling against
        # data the tests invented, so the smoke test goes first, against a
        # freshly migrated stack.
        env:
          SMARTHR_WAIT_TRIES: "60"
        run: |
          pip install requests
          python scripts/e2e_smoke.py
      - name: Run service test suites (unit + integration)
        run: |
          set -e
          for s in auth core-hr career-sim workload policy-gen retention; do
            echo "::group::$s tests"
            docker compose exec -T $s python manage.py test --noinput --verbosity 1
            echo "::endgroup::"
          done
          # future-skills runs against Postgres rather than its default
          # in-memory SQLite: its async prediction path uses a real worker
          # thread, and SQLite cannot serve two concurrent writers, so the
          # suite flakes on "database table is locked" under the load of the
          # full stack. Production is Postgres, so this matches it.
          echo "::group::future-skills tests (postgres)"
          docker compose exec -T future-skills \
            python manage.py test --noinput --verbosity 1 \
            --settings=config.settings.test_postgres
          echo "::endgroup::"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=120

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
