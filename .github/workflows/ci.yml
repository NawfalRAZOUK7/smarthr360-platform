name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jwt-auth-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install & test smarthr360-jwt-auth
        run: |
          pip install -e "packages/smarthr360-jwt-auth[dev]"
          pytest packages/smarthr360-jwt-auth/tests/ -v

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          cp .env.example .env
          mkdir -p keys && touch keys/jwt_private.pem keys/jwt_public.pem
          docker compose config -q
