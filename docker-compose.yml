# SmartHR360 platform — local development composition.
# Prerequisite: run ./scripts/generate_rsa_keys.sh once (creates ./keys).
# Service repos are expected as git submodules (services/<name>) —
# see README "Umbrella setup".

name: smarthr360

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smarthr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: smarthr
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthr"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  auth:
    build: ./services/smarthr360-auth
    environment:
      # local compose serves plain HTTP: base settings keep SSL-redirect off (production.py forces it on)
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${AUTH_SECRET_KEY:?set in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: "auth,localhost,127.0.0.1"
      DATABASE_URL: postgres://smarthr:${POSTGRES_PASSWORD}@postgres:5432/smarthr_auth
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
      # user.registered provisioning: create the core-hr profile at signup
      AUTH_PROVISIONING_URLS: http://core-hr:8000/api/hr/employees/me/
    secrets: [jwt_private.pem, jwt_public.pem]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8000:8000"

  core-hr:
    build: ./services/smarthr360-core-hr
    environment:
      # local compose serves plain HTTP: base settings keep SSL-redirect off (production.py forces it on)
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${CORE_HR_SECRET_KEY:?set in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: "core-hr,localhost,127.0.0.1"
      DATABASE_URL: postgres://smarthr:${POSTGRES_PASSWORD}@postgres:5432/smarthr_core_hr
      SMARTHR_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
    secrets: [jwt_public.pem]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8001:8000"

  career-sim:
    build: ./services/smarthr360-career-sim
    environment:
      # local compose serves plain HTTP: base settings keep SSL-redirect off (production.py forces it on)
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${CAREER_SIM_SECRET_KEY:?set in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: "career-sim,localhost,127.0.0.1"
      DATABASE_URL: postgres://smarthr:${POSTGRES_PASSWORD}@postgres:5432/smarthr_career
      SMARTHR_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
    secrets: [jwt_public.pem]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8003:8000"

  future-skills:
    build: ./services/smarthr360_m3_future_skills
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${FUTURE_SKILLS_SECRET_KEY:?set in .env}
      DATABASE_URL: postgresql://smarthr:${POSTGRES_PASSWORD}@postgres:5432/smarthr_future_skills
      ALLOWED_HOSTS: "future-skills,localhost,127.0.0.1,0.0.0.0"
      # local compose serves plain HTTP — disable prod SSL/secure-cookie enforcement
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      # newer MLflow rejects the ./mlruns file store unless opted in
      MLFLOW_ALLOW_FILE_STORE: "true"
      # Platform auth: trust RS256 tokens from the auth service via JWKS
      AUTH_JWKS_URL: http://auth:8000/.well-known/jwks.json
      AUTH_ISSUER: smarthr360
      AUTH_JWT_ALGORITHMS: RS256
      AUTH_LOCAL_ENABLED: "False"
      AUTH_USERINFO_URL: http://auth:8000/api/auth/me/
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_started }
    ports:
      - "8004:8000"

  workload:
    build: ./services/smarthr360-workload
    environment:
      # local compose serves plain HTTP: base settings keep SSL-redirect off (production.py forces it on)
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${WORKLOAD_SECRET_KEY:?set in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: "workload,localhost,127.0.0.1"
      DATABASE_URL: postgres://smarthr:${POSTGRES_PASSWORD}@postgres:5432/smarthr_workload
      SMARTHR_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
    secrets: [jwt_public.pem]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8005:8000"

  policy-gen:
    build: ./services/smarthr360-policy-gen
    environment:
      # local compose serves plain HTTP: base settings keep SSL-redirect off (production.py forces it on)
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${POLICY_GEN_SECRET_KEY:?set in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: "policy-gen,localhost,127.0.0.1"
      DATABASE_URL: postgres://smarthr:${POSTGRES_PASSWORD}@postgres:5432/smarthr_policy
      SMARTHR_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
    secrets: [jwt_public.pem]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8006:8000"

  retention:
    build: ./services/smarthr360-retention
    environment:
      # local compose serves plain HTTP: base settings keep SSL-redirect off (production.py forces it on)
      DJANGO_SETTINGS_MODULE: config.settings.base
      SECRET_KEY: ${RETENTION_SECRET_KEY:?set in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: "retention,localhost,127.0.0.1"
      DATABASE_URL: postgres://smarthr:${POSTGRES_PASSWORD}@postgres:5432/smarthr_retention
      SMARTHR_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public.pem
    secrets: [jwt_public.pem]
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8007:8000"

secrets:
  jwt_private.pem:
    file: ./keys/jwt_private.pem
  jwt_public.pem:
    file: ./keys/jwt_public.pem

volumes:
  pgdata:
