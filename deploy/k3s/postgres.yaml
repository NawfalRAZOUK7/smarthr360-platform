apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: smarthr360
data:
  init.sql: |
    CREATE DATABASE smarthr_auth;
    CREATE DATABASE smarthr_core_hr;
    CREATE DATABASE smarthr_career;
    CREATE DATABASE smarthr_future_skills;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: smarthr360
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: smarthr
            - name: POSTGRES_DB
              value: smarthr
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "smarthr"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: smarthr360
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
