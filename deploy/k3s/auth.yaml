apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: smarthr360
  labels: { app: auth }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: ghcr.io/nawfalrazouk7/smarthr360-auth:main
          ports:
            - containerPort: 8000
          env:
            - name: ALLOWED_HOSTS
              value: "auth,auth.smarthr360.example.com"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: app-secrets, key: AUTH_SECRET_KEY }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: "postgres://smarthr:$(POSTGRES_PASSWORD)@postgres:5432/smarthr_auth"
            - name: JWT_PRIVATE_KEY_FILE
              value: /keys/jwt_private.pem
            - name: JWT_PUBLIC_KEY_FILE
              value: /keys/jwt_public.pem
            - name: AUTH_PROVISIONING_URLS
              value: http://core-hr:8000/api/hr/employees/me/
          volumeMounts:
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /healthz/, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz/, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: jwt-keys
          secret: { secretName: jwt-keys }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: smarthr360
spec:
  selector: { app: auth }
  ports:
    - port: 8000
