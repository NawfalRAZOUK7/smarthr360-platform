# Prometheus scrape config for the docker-compose stack.
# Inside the `smarthr360` compose network, each service is reachable by its
# service name on its internal port 8000 (gunicorn), and exposes /metrics via
# django-prometheus (+ the custom smarthr360_* series).
#
# This differs from prometheus.yml (host-network variant, localhost:800x).

global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: smarthr360
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8000"]
        labels: { service: auth }
      - targets: ["core-hr:8000"]
        labels: { service: core-hr }
      - targets: ["career-sim:8000"]
        labels: { service: career-sim }
      - targets: ["workload:8000"]
        labels: { service: workload }
      - targets: ["policy-gen:8000"]
        labels: { service: policy-gen }
      - targets: ["retention:8000"]
        labels: { service: retention }
      - targets: ["future-skills:8000"]
        labels: { service: future-skills }
